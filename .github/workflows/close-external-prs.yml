name: Close external pull requests

# novaos-agent-sdk-public is a CI-produced release mirror; it never accepts
# human pull requests. Auto-close anything not opened by the mirror bot or a
# known maintainer, and point the author at the issue tracker instead.

on:
  pull_request_target:
    types: [opened]

permissions:
  pull-requests: write

jobs:
  close-external:
    runs-on: ubuntu-latest
    if: ${{ !endsWith(github.event.pull_request.user.login, '[bot]') }}
    steps:
      - name: Check whether the author is an allowed maintainer
        id: check
        env:
          AUTHOR: ${{ github.event.pull_request.user.login }}
          # Replace this static list with a CODEOWNERS-team membership check
          # once the mirror's maintainer team is decided.
          ALLOWED: "ashulean,orbitron-admin,Tamas-Orbitron,ferasalawadi"
        run: |
          if [[ ",${ALLOWED}," == *",${AUTHOR},"* ]]; then
            echo "allowed=true" >> "$GITHUB_OUTPUT"
          else
            echo "allowed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Comment and close
        if: steps.check.outputs.allowed == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            const body = [
              "## This repository is a read-only release mirror",
              "",
              "`novaos-agent-sdk-public` is a CI-produced release artifact: every commit on `main` is a squashed export pushed automatically from the private source repository when a release is tagged. It never receives a human commit, and pull requests against it cannot be merged.",
              "",
              "If you found a bug or have a feature request, please open an [issue](../../issues) instead — do not open a pull request. Issues are welcome and read by maintainers; PRs opened here will be closed automatically.",
            ].join("\n");
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body,
            });
            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              state: "closed",
            });
